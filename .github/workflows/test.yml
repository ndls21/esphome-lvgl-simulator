name: Smoke Tests

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install Playwright
        run: |
          npm install @playwright/test
          npx playwright install --with-deps chromium

      - name: Run smoke tests (local server)
        run: npx playwright test --reporter=list

      - name: Commit screenshots to branch
        if: always() && github.event_name == 'pull_request'
        run: |
          mkdir -p test-screenshots
          find test-results -name "*.png" -exec cp {} test-screenshots/ \; 2>/dev/null || true
          if [ "$(ls -A test-screenshots 2>/dev/null)" ]; then
            git config user.email "ci@github.com"
            git config user.name "CI Bot"
            git add test-screenshots/
            git diff --cached --quiet || git commit -m "ci: update smoke test screenshots [skip ci]" && \
              git push origin HEAD:${{ github.head_ref }}
          fi

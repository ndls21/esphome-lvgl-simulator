<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ESPHome LVGL Simulator</title>
    <!-- Live URL: https://ndls21.github.io/esphome-lvgl-simulator/ -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;700&family=Roboto:wght@400;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <div class="app-container">
        <div class="editor-panel">
            <div class="panel-header">
                <h3>ESPHome LVGL Configuration</h3>
                <div class="load-buttons">
                    <button id="loadConfig" class="btn">Load Config</button>
                    <button id="loadZip" class="btn">Load ZIP</button>
                    <button id="loadFolder" class="btn">Load Folder</button>
                </div>
            </div>
            <textarea id="yamlEditor" placeholder="Paste your ESPHome LVGL YAML configuration here..."></textarea>
            <div class="controls">
                <button id="renderPreview" class="btn btn-primary">Render Preview</button>
                <button id="loadExample" class="btn">Load Example</button>
            </div>
            <div class="url-input-row" style="display:flex;align-items:center;gap:6px;padding:4px 0;font-size:12px;">
                <label for="configFileUrl" style="white-space:nowrap;color:#aaa;">Config URL (for package resolution):</label>
                <input type="text" id="configFileUrl"
                       placeholder="https://raw.githubusercontent.com/you/repo/main/device.yaml"
                       style="flex:1;background:#1e1e2e;color:#cdd6f4;border:1px solid #45475a;border-radius:4px;padding:4px 8px;font-size:12px;" />
            </div>
        </div>

        <div class="preview-panel">
            <div class="panel-header">
                <h3>LVGL Display Preview</h3>
                <div class="display-info">
                    <span id="displaySize">466x466</span>
                    <span id="colorDepth">16-bit</span>
                    <select id="displayPreset">
                      <option value="">Auto (from YAML)</option>
                      <option value="466x466">Waveshare 1.75" Round — 466×466</option>
                      <option value="480x480">Waveshare 2.1" Round — 480×480</option>
                      <option value="320x240">ESP32 2.8" / CYD / M5Stack — 320×240</option>
                      <option value="320x170">T-Display S3 — 320×170</option>
                      <option value="450x600">Lilygo T4 S3 — 450×600</option>
                      <option value="custom">Custom...</option>
                    </select>
                    <span id="customSizeInputs" style="display:none">
                      <input type="number" id="customWidth" placeholder="W" style="width:50px">
                      ×
                      <input type="number" id="customHeight" placeholder="H" style="width:50px">
                    </span>
                    <button id="shareBtn" class="btn" title="Copy shareable link to clipboard">&#9138; Share</button>
                </div>
            </div>
            <div class="page-nav">
                <button id="prevPage" class="btn" disabled>&#9664;</button>
                <select id="pageSelect"></select>
                <button id="nextPage" class="btn" disabled>&#9654;</button>
                <span id="pageInfo" class="page-info-text">— / —</span>
                <span style="opacity:0.4;font-size:11px">← → ↑ ↓ or swipe</span>
                <label style="font-size:12px;opacity:0.7">Rotation:
                  <select id="rotationSelect" style="font-size:12px;background:#222;color:#ccc;border:1px solid #444;padding:2px 4px;border-radius:3px">
                    <option value="0">0°</option>
                    <option value="90">90°</option>
                    <option value="180">180°</option>
                    <option value="270">270°</option>
                  </select>
                </label>
            </div>
            <div id="entitySummary" class="entity-summary" style="display:none">
                <div id="entityBadges" class="entity-badges"></div>
            </div>
            <div class="display-container">
                <div id="lvglDisplay" class="lvgl-display">
                    <div class="placeholder">
                        <p>Load a configuration to see the preview</p>
                    </div>
                </div>
            </div>
        </div>

        <div id="mockPanel" class="mock-panel">
          <div class="panel-header">
            <h3>Mock Data</h3>
            <div style="display:flex;gap:6px;align-items:center">
              <button id="resetMockData" class="btn" title="Reset all values to defaults">&#8635; Reset</button>
              <button id="toggleMockPanel" class="btn" title="Collapse panel">&#9664;</button>
            </div>
          </div>
          <div class="mock-presets-row">
            <select id="presetSelect">
              <option value="__default__">Default</option>
            </select>
            <button id="savePreset" class="mock-btn">Save</button>
            <button id="deletePreset" class="mock-btn">Delete</button>
          </div>
          <div id="mockPanelBody" class="mock-panel-body">
            <div id="mockControls" class="mock-controls">
              <div class="mock-empty">Load a config with sensors or globals to see controls here.</div>
            </div>
          </div>
          <div class="live-device-section" id="liveDeviceSection">
            <div class="live-device-header">
              Live Device
              <span class="live-dot live-dot--off" id="liveDot"></span>
              <span id="liveStatusText">Not connected</span>
            </div>
            <div class="live-device-body" id="liveDeviceBody">
              <label class="live-field-label">Device IP</label>
              <input type="text" id="liveHost" placeholder="192.168.1.100" />
              <label class="live-field-label">Proxy WebSocket</label>
              <input type="text" id="liveProxyUrl" placeholder="ws://localhost:6054" />
              <div class="live-btn-row">
                <button id="liveConnect" class="mock-btn">Connect</button>
                <button id="liveDisconnect" class="mock-btn" disabled>Disconnect</button>
              </div>
              <div id="liveError" class="live-error" style="display:none"></div>
              <div id="liveInfo" class="live-info" style="display:none"></div>
              <div id="liveWarn" class="live-warn" style="display:none"></div>
            </div>
          </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/js-yaml@4.1.0/dist/js-yaml.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/jszip@3.10.1/dist/jszip.min.js"></script>
    <script type="module" src="lvgl-simulator.js"></script>
</body>
</html>

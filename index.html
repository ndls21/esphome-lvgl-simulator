<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ESPHome LVGL Simulator</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;700&family=Roboto:wght@400;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <div class="app-container">
        <div class="editor-panel">
            <div class="panel-header">
                <h3>ESPHome LVGL Configuration</h3>
                <button id="loadConfig" class="btn">Load Config</button>
            </div>
            <textarea id="yamlEditor" placeholder="Paste your ESPHome LVGL YAML configuration here..."></textarea>
            <div class="controls">
                <button id="renderPreview" class="btn btn-primary">Render Preview</button>
                <button id="loadExample" class="btn">Load Example</button>
            </div>
        </div>

        <div class="preview-panel">
            <div class="panel-header">
                <h3>LVGL Display Preview</h3>
                <div class="display-info">
                    <span id="displaySize">466x466</span>
                    <span id="colorDepth">16-bit</span>
                </div>
            </div>
            <div class="page-nav">
                <button id="prevPage" class="btn" disabled>&#9664;</button>
                <select id="pageSelect"></select>
                <button id="nextPage" class="btn" disabled>&#9654;</button>
                <span id="pageInfo" class="page-info-text">— / —</span>
            </div>
            <div class="display-container">
                <div id="lvglDisplay" class="lvgl-display">
                    <div class="placeholder">
                        <p>Load a configuration to see the preview</p>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/js-yaml@4.1.0/dist/js-yaml.min.js"></script>
    <script src="lvgl-simulator.js"></script>
</body>
</html>
